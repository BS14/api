name: Retag Release Image

on:
  release:
    types: [published]

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Set short SHA of release commit
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Derive version from release name
        id: version
        run: |
          VERSION="${{ github.event.release.name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bnay14
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Retag existing commit image with release version
        run: |
          docker buildx imagetools create \
            --tag bnay14/fastapi:${{ steps.version.outputs.version }} \
            bnay14/fastapi:${{ steps.vars.outputs.sha_short }}
